[package]
name = "limpiador-de-csv"
version = "1.0.0"
description = "Utilidad para Windows que limpia y ordena archivos CSV con un solo clic."
authors = ["Victoria Sanjurjo"]
license = "MIT"
edition = "2021"

[lib]
name = "limpiador_de_csv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
rfd = "0.15"
encoding_rs = "0.8"
unicode-normalization = "0.1"

